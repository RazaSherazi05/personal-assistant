<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Assistant">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{% block title %}Life Assistant{% endblock %}</title>
</head>
<body>
  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% if session.ok %}
  <nav class="tabbar">
    <a href="{{ url_for('today') }}" class="{{ 'on' if active == 'today' }}"><span class="ico">☀︎</span>Today</a>
    <a href="{{ url_for('food_page') }}" class="{{ 'on' if active == 'food' }}"><span class="ico">🍽</span>Food</a>
    <a href="{{ url_for('german_page') }}" class="{{ 'on' if active == 'german' }}"><span class="ico">Aa</span>German</a>
    <a href="{{ url_for('trains_page') }}" class="{{ 'on' if active == 'trains' }}"><span class="ico">🚆</span>Trains</a>
    <a href="{{ url_for('review_page') }}" class="{{ 'on' if active == 'review' }}"><span class="ico">📈</span>Review</a>
  </nav>
  {% endif %}
</body>
</html>
